<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Mahashivratri</title>

<style>
body {
    margin: 0;
    background: black;
    overflow: hidden;
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;
}

h1 {
    margin-top: 20px;
    font-size: 40px;
    color: #00f7ff;
    text-shadow: 0 0 20px #00f7ff;
}

.container {
    position: relative;
    width: 350px;
    height: 350px;
    margin: 30px auto;
}

.circle-text {
    position: absolute;
    width: 100%;
    height: 100%;
    animation: rotate 15s linear infinite;
}

.circle-text span {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: 0 160px;
    font-size: 20px;
    color: #00f7ff;
    text-shadow: 0 0 10px #00f7ff;
    font-weight: bold;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.trishul {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 120px;
    color: #ff9800;
    text-shadow: 0 0 25px #ff9800;
}

.dancing {
    margin-top: 20px;
    font-size: 22px;
    color: #ff00ff;
    animation: dance 1.5s infinite alternate;
}

@keyframes dance {
    from { transform: translateY(0px); }
    to { transform: translateY(10px); }
}

button {
    margin-top: 20px;
    padding: 12px 25px;
    font-size: 18px;
    background: #00f7ff;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
}

.arrow {
    font-size: 35px;
    margin-top: 10px;
    animation: bounce 1s infinite;
    font-weight: bold;
}

@keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(10px); }
}

.blessing {
    display: none;
    margin-top: 30px;
    font-size: 22px;
    color: #00ffcc;
    animation: fadeIn 2s ease-in-out forwards;
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.5); }
    to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>

<h1>Happy Mahashivratri</h1>

<div class="container">
    <div class="circle-text" id="circleText"></div>
    <div class="trishul">🔱</div>
</div>

<div class="dancing">ॐ नमः शिवाय 🔱</div>

<div class="arrow">⬇⬇⬇</div>

<button id="blessBtn">Tap for Blessings</button>

<div class="blessing" id="blessingText">
    May Lord Shiva bless you with peace, strength and prosperity.
    Har Har Mahadev 🙏
</div>

<audio id="shivAudio" src="OmNamahShivaya.mp3"></audio>

<script>
const text = "OM NAMAH SHIVAY ✨ OM NAMAH SHIVAY ✨ ";
const circle = document.getElementById("circleText");

const characters = text.split("");
const angle = 360 / characters.length;

characters.forEach((char, i) => {
    const span = document.createElement("span");
    span.innerText = char;
    span.style.transform = `rotate(${i * angle}deg)`;
    circle.appendChild(span);
});

document.getElementById("blessBtn").addEventListener("click", function() {
    document.getElementById("shivAudio").play();
    this.style.display = "none";
    document.querySelector(".arrow").style.display = "none";
    document.getElementById("blessingText").style.display = "block";
});
</script>

</body>
</html>
