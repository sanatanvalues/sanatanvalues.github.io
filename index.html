<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Har Har Mahadev</title>

<style>
body {
    margin:0;
    padding:0;
    text-align:center;
    background: radial-gradient(circle at center, #020024, #000000);
    font-family: Arial, sans-serif;
    color:white;
    overflow:hidden;
}

.particle {
    position:absolute;
    width:4px;
    height:4px;
    background:cyan;
    border-radius:50%;
    animation:float 10s infinite linear;
}
@keyframes float {
    from {transform:translateY(100vh);}
    to {transform:translateY(-10vh);}
}

.trishul-container {
    margin-top:30px;
    position:relative;
    height:300px;
}

.trishul {
    font-size:120px;
    color:gold;
    text-shadow:0 0 20px gold,
                0 0 40px orange,
                0 0 60px gold;
    position:absolute;
    top:80px;
    left:50%;
    transform:translateX(-50%);
}

.om-text {
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:260px;
    height:260px;
    border-radius:50%;
    animation:rotate 15s linear infinite;
}

.om-text span {
    position:absolute;
    left:50%;
    transform-origin:0 130px;
    color:cyan;
    font-size:16px;
    text-shadow:0 0 10px cyan, 0 0 20px cyan;
}

@keyframes rotate {
    from {transform:translateX(-50%) rotate(0deg);}
    to {transform:translateX(-50%) rotate(360deg);}
}

.content {
    margin-top:40px;
}

h1 {
    font-size:34px;
    margin:10px 0;
}

.subtitle {
    font-size:22px;
    margin-bottom:15px;
}

.blessing-btn {
    margin-top:20px;
    font-size:20px;
    padding:12px 25px;
    background:transparent;
    border:2px solid cyan;
    color:white;
    border-radius:10px;
    cursor:pointer;
    animation:dance 1s infinite alternate;
}

@keyframes dance {
    0% {transform:scale(1);}
    100% {transform:scale(1.1);}
}

.blessing-btn:hover {
    background:cyan;
    color:black;
}

.footer {
    margin-top:25px;
    font-size:18px;
    color:#ccc;
    display:none;
}
</style>
</head>

<body>

<script>
for(let i=0;i<40;i++){
 let p=document.createElement("div");
 p.className="particle";
 p.style.left=Math.random()*100+"vw";
 p.style.animationDuration=(5+Math.random()*5)+"s";
 document.body.appendChild(p);
}
</script>

<div class="trishul-container">
    <div class="om-text" id="circleText"></div>
    <div class="trishul">🔱</div>
</div>

<div class="content">
    <h1>Happy Mahashivratri</h1>
    <div class="subtitle">Har Har Mahadev 🙏</div>

    <button class="blessing-btn" id="blessBtn" onclick="giveBlessing()">
        इस बटन को दबा कर<br>
        शिव का आशीर्वाद प्राप्त करें
    </button>

    <div class="footer" id="blessingMessage">
        🕉 May Lord Shiva bless you with strength, peace and success.
    </div>
</div>

<audio id="shivAudio">
<source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" type="audio/mpeg">
</audio>

<script>

function giveBlessing(){
    document.getElementById("shivAudio").play();
    document.getElementById("blessBtn").style.display="none";
    document.getElementById("blessingMessage").style.display="block";
}

const text=" OM NAMAH SHIVAYA ";
const circle=document.getElementById("circleText");

for(let i=0;i<text.length;i++){
 let span=document.createElement("span");
 span.innerText=text[i];
 span.style.transform="rotate("+ (i*12) +"deg)";
 circle.appendChild(span);
}
</script>

</body>
    </html>
